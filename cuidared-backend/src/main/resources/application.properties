# ============================================================
#  CuidaRed - Configuracion de la aplicacion
# ============================================================

spring.application.name=cuidared-backend

# ------------------------------------------------------------
#  Conexion a PostgreSQL
#  Las credenciales se pueden sobreescribir con variables de
#  entorno (DB_URL, DB_USER, DB_PASSWORD) sin tocar este archivo.
# ------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cuidared}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------------------------------
#  JPA / Hibernate
# ------------------------------------------------------------
# update -> Hibernate crea/actualiza las tablas a partir de las entidades
#           (usar 'create' para empezar de cero, 'validate' en produccion)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Muestra el SQL generado en consola (poner en false para silenciar)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Mantiene la sesion de Hibernate abierta durante el renderizado de la
# respuesta JSON, evitando LazyInitializationException al serializar las
# colecciones (horarios, habilidades, etc.). Adecuado para esta escala.
spring.jpa.open-in-view=true

# ------------------------------------------------------------
#  Seguridad - JWT
#  El secreto debe tener al menos 32 caracteres (HS256). En
#  produccion se sobreescribe con la variable de entorno JWT_SECRET.
# ------------------------------------------------------------
jwt.secret=${JWT_SECRET:cuidared-clave-secreta-academica-cambiar-en-produccion-0123456789}
# Duracion del token en milisegundos (por defecto 24 horas)
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
